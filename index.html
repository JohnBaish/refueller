<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Refueller – fuel prices near you</title>
    <meta name="description" content="Check unleaded and diesel prices at the eight nearest petrol stations to any postcode in Great Britain, with opening times, from the Government's Fuel Finder service. Free." />
    <link rel="canonical" href="https://refueller.baish.net/" />
    <!-- Search (SEO): the <title> and search description are for search results (John, 30 October); the canonical link
         names the one main address. The og:/twitter: tags below are for link previews and keep the shorter wording drawn
         into the preview picture (design/og-refueller.html). Update that tagline when Refueller gains more features. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Refueller" />
    <meta property="og:description" content="Nearby petrol and diesel prices" />
    <meta property="og:image" content="https://refueller.baish.net/og-refueller.png" />
    <meta property="og:url" content="https://refueller.baish.net/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Refueller" />
    <meta name="twitter:description" content="Nearby petrol and diesel prices" />
    <meta name="twitter:image" content="https://refueller.baish.net/og-refueller.png" />
    <!-- Dark mode: set before the page draws, so there's no flash of the wrong colours. A choice kept by the switch wins;
         otherwise the device's own setting (HOUSE-STYLE §2). The same key and rule as src/lib/theme.ts. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('refueller.theme') } catch (e) {}
        var device = false
        try { device = window.matchMedia('(prefers-color-scheme: dark)').matches } catch (e) {}
        if (t === 'dark' || (t !== 'light' && device)) document.documentElement.dataset.theme = 'dark'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
