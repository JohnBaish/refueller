# Builds the two AWS Lambda packages: the collector (PLAN Stage 2) and the probe (Stage 1c). Run by hand only ("Run workflow").
# Each package is ONE JavaScript file made from this repo's own code (nothing from npm inside it), zipped, and kept as a
# downloadable file on the run page. There are no secrets anywhere in them or in this workflow; the values they need
# are typed into AWS by John. Read-only permissions: the job can't change the repo.
name: Build Lambda packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lambda-package
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install (from the lock file)
        run: npm ci

      - name: Lint, type-check and run every check
        run: |
          npm run lint
          npm run typecheck
          npm run check

      - name: Build the packages
        run: |
          npm run build:lambda
          rm -f dist-lambda/*.zip
          zip -j -q dist-lambda/refueller-collector.zip dist-lambda/collector/index.mjs
          zip -j -q dist-lambda/refueller-probe.zip dist-lambda/probe/index.mjs
          unzip -l dist-lambda/refueller-collector.zip
          unzip -l dist-lambda/refueller-probe.zip
          sha256sum dist-lambda/*/index.mjs dist-lambda/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: refueller-collector-lambda
          path: dist-lambda/refueller-collector.zip
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: refueller-probe-lambda
          path: dist-lambda/refueller-probe.zip
          if-no-files-found: error
          retention-days: 14
