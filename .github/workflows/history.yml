# Keeps data/history.json, the last 14 days of prices for the "Price history" graph (scripts/build-history.ts). Runs after each
# collection reaches main (the collector on AWS commits data/prices.json twice a day), or by hand ("Run workflow"). It reads the
# last 17 days of data/prices.json from git and commits the result to main if it changed. No secrets; nothing from npm runs.
# A commit made with GITHUB_TOKEN doesn't start this or any other workflow again, so there's no loop.
name: Price history

on:
  push:
    branches: [main]
    paths: [data/prices.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Fetch the last 17 days of main
        run: git fetch --shallow-since="17 days ago" origin main

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build data/history.json
        run: node scripts/build-history.ts

      - name: Commit it if it changed
        run: |
          if git diff --quiet -- data/history.json; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "History: $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            sleep 10
            git pull --rebase origin main
          done
          exit 1
